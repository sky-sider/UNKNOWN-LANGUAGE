/* v0.3: 場所と証拠・解読をひとつのパネルに統合 */
.app{width:100%;grid-template-columns:minmax(0,1fr)}
.masthead,.main,.nav{min-width:0}
.toolbar select{width:0;min-width:0;flex:1 1 0}
.mastline>div:first-child{min-width:0}
.nav{grid-template-columns:repeat(4,minmax(0,1fr))}
.nav button{min-height:56px;font-size:12px}
.masthead{padding-bottom:8px}
.toolbar{gap:7px}.toolbar-label{font-size:11px;color:var(--dim);white-space:nowrap;font-weight:700}
.room-head{margin:0 0 14px;padding:13px 14px;border:1px solid #3a7284;border-radius:12px;background:radial-gradient(circle at 85% 40%,#183b4d,#0c1f2e 66%);position:relative;overflow:hidden}
.room-head:after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.17;background-image:linear-gradient(90deg,transparent 96%,#86d7e5 98%),linear-gradient(0deg,transparent 96%,#86d7e5 98%);background-size:20px 20px}
.room-top{font:700 11px ui-monospace,monospace;color:var(--cyan);letter-spacing:.12em;position:relative;z-index:1}
.room-details{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.room-symbol{width:80px;flex:0 0 80px;height:74px;display:flex;align-items:center;justify-content:center}
.room-symbol svg{width:75px;height:70px;stroke:#74dded;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.room-title{font-weight:800;font-size:19px;line-height:1.4;margin:4px 0}
.room-caption{color:#b7d0dd;font-size:13px;line-height:1.55}
.panel-section{margin:15px 0 18px;scroll-margin-top:12px}
.panel-quickbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.panel-quickbar button{min-height:43px;border:1px solid #376c81;background:#102a3a;border-radius:8px;color:#d6eaf4;font-weight:700}
.panel-quickbar button:last-child{border-color:#5ba1b6;color:#aaf6ff;background:#153d4e}
.panel-section h2{font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.panel-section h2 .index{font:700 11px ui-monospace,monospace;color:#08202e;background:#74e2ef;border-radius:4px;padding:3px 6px}
.panel-lead{font-size:13px;color:var(--dim);margin:3px 0 10px}
.panel-evidence{display:flex;gap:10px;align-items:center;min-height:90px;background:#0e2638;border:1px solid #335e74;border-radius:10px;padding:10px 10px;margin:8px 0}
.panel-evidence .scene-frame{flex:0 0 62px;min-height:65px;width:62px}
.panel-evidence .scene-icon{width:58px;height:56px}
.panel-evidence-body{flex:1;min-width:0}
.panel-evidence-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.panel-evidence .glyph-line{margin:5px 0 3px;gap:4px}
.panel-evidence .glyph{min-height:34px;padding:4px 6px;font-size:15px}
.panel-evidence .scene-text{font-size:12px;color:#c4d8e3;line-height:1.5}
.panel-evidence .quickcompare{font-size:12px;min-height:32px;padding:4px 7px;color:var(--cyan);background:#102f42;border:1px solid #3e7187;border-radius:6px;white-space:nowrap}
.challenge-block{border:1px solid #397287;background:#0b2233;border-radius:12px;padding:13px;margin-top:7px}
.challenge-block .question{margin:8px 0 12px;background:#071b29}
.challenge-block .option-grid{margin:10px 0 11px}
.challenge-block .option{min-height:90px}
.challenge-block .option.action{min-height:58px}
.challenge-block .btn.full{margin-top:8px}
.panel-help{border-top:1px solid #30566a;margin-top:15px;padding-top:12px}
.panel-footer{font-size:12px;color:var(--dim);margin:12px 0}
.panel-footer button{min-height:38px}
.feedback.ok{margin:10px 0 4px}
.panel-recent-token{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 11px;background:#173344;border:1px solid #40768c;border-radius:9px;margin:10px 0;font-size:13px}
.panel-recent-token button{font-size:12px;padding:5px 10px;background:#194457;border:1px solid #4b8ba0;border-radius:6px;color:#dffaff}
.step-info{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-size:12px}
@media(max-width:370px){.nav button{font-size:11px}.room-head{padding:11px}.room-symbol{width:60px;flex-basis:60px}.room-symbol svg{width:58px}.room-title{font-size:17px}.panel-evidence{padding:8px;gap:7px}.panel-evidence .scene-frame{flex-basis:53px;width:53px;min-height:58px}.panel-evidence .scene-icon{width:51px;height:49px}.panel-evidence .quickcompare{font-size:11px;padding-inline:5px}.panel-evidence .glyph{font-size:13px;min-height:32px;padding:4px 5px}.challenge-block{padding:9px}}

/* Full trial 1.0: area routes, logic workbench, readable long-form evidence */
:root{--dim:#b2cbd9}
.route-box{border:1px solid #295264;background:#0b2030;border-radius:12px;margin:13px 0 15px;padding:11px}
.route-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
.route-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.select,.small-btn,.quickcompare,.glyph.click{min-height:44px}
.option{min-height:48px}
.route-stop{min-width:0;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:2px;padding:9px 7px;border:1px solid #31546a;border-radius:8px;background:#102c40;color:#e8f3ff;min-height:82px}
.route-stop.current{border-color:#6ce8f0;background:#164156;box-shadow:inset 0 0 0 1px #6ce8f050}
.route-stop.cleared:not(.current){border-color:#447360}
.route-stop:disabled{opacity:.52;cursor:not-allowed}
.route-num{font:700 11px ui-monospace,Consolas,monospace;color:#8ceaf3}
.route-name{font-size:12px;line-height:1.4;font-weight:750;overflow-wrap:anywhere}
.route-state{font-size:11px;color:#b9d2df;margin-top:auto;overflow-wrap:anywhere}
.schematic{fill:none;stroke:#70ddf1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.option-letter{display:grid;place-items:center;font:800 17px ui-monospace,monospace;color:#a8eff6;flex:none;width:31px;height:31px;border:1px solid #36748b;border-radius:6px;background:#112e43}
.option:not(.action){display:flex;align-items:center;gap:12px;text-align:left}
.option:not(.action) .scene-icon{flex:none}
.option-label{overflow-wrap:anywhere}
.word-break{flex-basis:100%;height:0}
.glyph .suffix{color:#ffc77c}
.glyph.marked .suffix{color:#493817}
.prompt-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.prompt-break{flex-basis:100%;height:4px}
.logic-info{padding:10px 12px;margin:9px 0;color:#d0e5ee;background:#112e42;border-left:3px solid #6ce8f0}
.condition-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.condition-card{border:1px solid #305568;background:#0b2535;border-radius:10px;padding:12px 9px;display:flex;flex-direction:column;gap:8px}
.condition-card strong{font-size:14px}
.condition-actions{display:flex;flex-wrap:wrap;gap:6px}
.condition-btn{border:1px solid #376078;background:#0c1b2b;border-radius:7px;min-height:46px;padding:8px;flex:1;color:#e8f3ff;white-space:nowrap;font-size:13px}
.condition-btn.selected{background:#1b5366;border-color:#7aebff;box-shadow:inset 0 0 0 1px #7aebff}
.filter-row{margin:12px 0;display:flex;flex-direction:column;gap:5px}
.filter-row label{font-size:13px;color:#c9d9e4}
.filter-row .select,.filter-row .input{width:100%}
.record-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.record-actions button{flex:1;min-width:115px}
.backup-box{border:1px solid #2c5468;border-radius:10px;padding:16px;margin-top:26px;background:#0b2030}
.backup-box .btnrow{display:flex;flex-wrap:wrap;gap:9px}
.reset-btn{margin-top:13px;color:#e5cad3}
.evidence-card[hidden],.dict-row[hidden]{display:none!important}
.sequence{display:grid;gap:8px;margin:12px 0}
.seq-step{padding:10px 12px!important;min-height:46px;text-align:left}
.final-options{grid-template-columns:1fr}
.chapter-report{border:1px solid #64ab9c;background:linear-gradient(135deg,#0a302f,#102c3c);margin:20px 0;padding:20px;border-radius:12px}
.chapter-report h2{margin:8px 0}
.scene-text{overflow-wrap:anywhere;line-height:1.65}
.panel-evidence .glyph-line{margin:8px 0}
.panel-quickbar button{min-height:44px}
@media(max-width:360px){.route-grid{gap:5px}.route-stop{padding:8px 5px}.route-name{font-size:11px}.route-state{font-size:10px}.route-num{font-size:10px}.condition-grid{grid-template-columns:1fr}.condition-actions{flex-wrap:nowrap}}

/* Adventure storytelling / v1.1 */
.app{position:relative}
#story-layer[hidden]{display:none!important}
#story-layer{position:absolute;inset:0;z-index:30;background:#07111b;display:flex;flex-direction:column;animation:storyFade .22s ease-out;overflow:hidden}
.story-vignette{flex:1;min-height:100px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 70%,rgba(28,97,123,.50),transparent 56%),linear-gradient(180deg,#07111b,#0e2635)}
.story-vignette::before{content:'';inset:0;position:absolute;opacity:.29;background:repeating-linear-gradient(90deg,transparent 0 48px,#2e6d8520 49px),repeating-linear-gradient(0deg,transparent 0 48px,#2e6d8524 49px);mask-image:linear-gradient(0deg,#000,transparent)}
.story-star{position:absolute;top:14%;left:16%;font-size:28px;color:#75cfe7;opacity:.35;text-shadow:0 0 18px #6ce8f0}
.story-room-art{height:100%;display:grid;place-items:center;opacity:.78;filter:drop-shadow(0 0 23px #40a2c965)}
.story-room-art svg{width:min(54vw,275px);height:min(54vw,275px);fill:none;stroke:#6ce8f0;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;opacity:.76}
.story-grid-haze{position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#6ce8f0,transparent);box-shadow:0 0 17px #6ce8f0a0;opacity:.6}
.story-dialog{padding:clamp(16px,4vw,29px);padding-bottom:max(17px,env(safe-area-inset-bottom));background:linear-gradient(175deg,#112c3d,#091724);border-top:1px solid #428ca5;box-shadow:0 -10px 60px #020811;max-height:min(74vh,740px);overflow-y:auto}
.story-chrome{display:flex;justify-content:space-between;gap:12px;font:11px ui-monospace,Consolas,monospace;letter-spacing:.10em;color:#88d6e3}
.story-count{color:#a8bdcd}
.story-heading{font-size:clamp(18px,4vw,23px);letter-spacing:.035em;margin:9px 0 14px;color:#edf9ff}
.story-speech{border-left:3px solid #5eb8dc;background:#071c2c;padding:14px 14px 13px;min-height:110px;border-radius:0 7px 7px 0}
.story-speech.story-prose{border-color:#94a5c8}
.story-speaker{font-weight:750;font-size:12px;letter-spacing:.04em;color:#9ddfe7;margin-bottom:7px}
.story-speech p{font-size:clamp(15px,3.5vw,17px);line-height:1.9;margin:0;color:#f1f6fa;white-space:pre-wrap;overflow-wrap:anywhere}
.story-controls{display:flex;gap:8px;margin-top:14px;justify-content:space-between;align-items:stretch}
.story-controls button{min-height:50px;flex:1;font-size:14px;padding:9px 8px}
.story-controls .story-next{flex:1.4}
.story-controls .story-skip{background:#0b2636}
.story-play-tip{font-size:11px;line-height:1.5;text-align:center;color:#b4c8d4;margin-top:10px}
.arrival-story{border:1px solid #31627c;background:linear-gradient(125deg,#092437,#102939);border-radius:12px;margin:13px 0 15px;overflow:hidden}
.arrival-story summary{padding:11px 12px;min-height:46px;cursor:pointer;font-size:14px;font-weight:750;display:flex;align-items:center;gap:7px;list-style:none}
.arrival-story summary::-webkit-details-marker{display:none}
.arrival-story summary::after{content:'⌄';margin-left:3px;color:#8cbed2;font-size:18px}
.arrival-story[open] summary::after{content:'⌃'}
.arrival-symbol{color:#8fe4ed}
.arrival-replay{margin-left:auto;font-size:11px;color:#b1cddc;font-weight:400}
.arrival-story-inside{padding:0 13px 13px}
.arrival-desc{font-size:15px;line-height:1.85;margin:7px 0 10px;color:#e7f2fb}
.arrival-terminal{border-top:1px solid #2e5b70;padding-top:9px;font-size:13px;color:#c1d6e4;line-height:1.65}
.arrival-terminal span{font-size:11px;margin-right:7px;color:#7fe4ec;font-weight:700}

.rune-inline{display:inline-flex;vertical-align:-.28em;padding:0 2px;color:var(--cyan)}

.rune-suffix{display:inline-flex;align-items:center;position:relative;margin-left:7px;padding-left:7px;border-left:2px solid currentColor;opacity:.97}
.rune-suffix:before{content:'';width:3px;height:3px;position:absolute;left:-2.5px;top:calc(50% - 1.5px);background:currentColor;border-radius:50%}
button.glyph.click{display:inline-flex;align-items:center;gap:0;max-width:100%;min-height:48px;padding:9px 8px;white-space:nowrap}

<script id="story-data" type="application/json">{"schemaVersion":1,"prologue":{"title":"通信の途絶えた観測所","tag":"PROLOGUE / ENTRY","beats":[{"speaker":"地の文","text":"尾根の向こうに、観測所の輪郭が浮かび上がった。雲の低い夜。細いアンテナだけが風に揺れている。"},{"speaker":"調査員","text":"この施設は、ずっと停止していたはずなのに。"},{"speaker":"地の文","text":"三日前、閉鎖された施設から短い信号が届いた。送信者の名前はない。ただ、未知の文字が一行だけ残されていた。"},{"speaker":"受信記録","text":"yori lito se baku yulu"},{"speaker":"補助端末","text":"現地の設備と接続します。文字体系：未登録。翻訳機能は使用できません。"},{"speaker":"地の文","text":"扉の内側には小さな青い光が残っている。答えは誰も持っていない。ならば、ここに残された記録を、一つずつ読むしかない。"}]},"chapterIntros":{"0":{"title":"誰もいない資料室","tag":"CHAPTER 00 / ARRIVAL","beats":[{"speaker":"地の文","text":"最初の室内は、妙に整然としていた。散らばった書類も、荒らされた棚もない。色と形の違う標本だけが、同じ間隔で並んでいる。"},{"speaker":"補助端末","text":"資料と画像記録の対応が確認できました。映像は読めます。言葉の意味は、まだわかりません。"}]},"1":{"title":"壁の向こうの駆動音","tag":"CHAPTER 01 / ARRIVAL","beats":[{"speaker":"地の文","text":"認証扉の先で、機械が小さく鳴った。静止していたはずの通路で、古い扉がゆっくり動いている。"},{"speaker":"補助端末","text":"動作ログが見つかりました。装置は、記録された文字列を命令として受け取っています。"}]},"2":{"title":"ふたりの影","tag":"CHAPTER 02 / ARRIVAL","beats":[{"speaker":"地の文","text":"監視回廊には古い映像が繰り返し流れている。腕章の違うふたりが、同じ荷物を動かしていた。"},{"speaker":"調査員","text":"誰が何をしたのか。文字を追うだけじゃ、もう足りない。"},{"speaker":"補助端末","text":"搬送路と監視回廊は、別々に調査できます。記録を突き合わせてください。"}]},"3":{"title":"動かなかった記録","tag":"CHAPTER 03 / ARRIVAL","beats":[{"speaker":"地の文","text":"この区画の記録は、奇妙なほど静かだった。「動いた」映像の隣に、まったく同じ装置が動かない映像が残っている。"},{"speaker":"補助端末","text":"複数のログに不作動が記録されています。故障か、指示された停止かは不明です。"}]},"4":{"title":"同じ方角を向く機械","tag":"CHAPTER 04 / ARRIVAL","beats":[{"speaker":"地の文","text":"低い駆動音が重なって聞こえる。棚の向こうでは、何台もの検出機が一斉に同じ方向を向いていた。"},{"speaker":"調査員","text":"一台の記録では、ここで起きたことを説明できそうにない。"}]},"5":{"title":"消された日付","tag":"CHAPTER 05 / ARRIVAL","beats":[{"speaker":"地の文","text":"古い端末には、閉鎖前に保存された時系列検証用の映像と予定表が残っていた。再生画面には基準時刻が記され、その前後の記録を切り替えられる。今の観測所を映したものではない。"},{"speaker":"補助端末","text":"この区画の映像と予定は、記録内の基準時刻を共有しています。観測所の現在時刻とは連動していません。"}]},"6":{"title":"条件がある理由","tag":"CHAPTER 06 / ARRIVAL","beats":[{"speaker":"地の文","text":"緊急区画の表示灯が、ひとつ、またひとつと点灯した。壁に書かれた命令は短いが、装置は状況によって反応を変えている。"},{"speaker":"調査員","text":"「何をするか」だけじゃない。「いつ、何をするか」を読まないと。"}]},"7":{"title":"最後の扉","tag":"CHAPTER 07 / ARRIVAL","beats":[{"speaker":"地の文","text":"地下へ降りると、音が消えた。中枢の扉には、どの区画にもなかった長い文章が刻まれている。"},{"speaker":"補助端末","text":"過去の記録と現在の観測値が接続されました。結論は、あなたが読み解いてください。"}]}},"chapterOutros":{"0":{"title":"光の先へ","tag":"CHAPTER 00 / INTERLUDE","beats":[{"speaker":"地の文","text":"資料室の外で、機械が応答した。扉の隙間から吹き込む空気は少し暖かい。観測所は完全に眠っているわけではない。"}]},"1":{"title":"残された人影","tag":"CHAPTER 01 / INTERLUDE","beats":[{"speaker":"地の文","text":"制御室の壁に、古い腕章の記録が浮かぶ。人がいた痕跡はある。それでも、今ここに呼びかけに答える者はいない。"}]},"2":{"title":"映像の奥の声","tag":"CHAPTER 02 / INTERLUDE","beats":[{"speaker":"地の文","text":"古い音声ログは、音が欠けて聞き取れない。腕章のふたりは何かを話していたらしい。残された文字だけが、まだ黙らない。"}]},"3":{"title":"意図された沈黙？","tag":"CHAPTER 03 / INTERLUDE","beats":[{"speaker":"地の文","text":"装置は動かず、扉は震えていた。「故障」という言葉が頭に浮かぶ。でも、同じ不作動が何度も記録されるのはなぜだろう。"}]},"4":{"title":"ひとつを見つめる目","tag":"CHAPTER 04 / INTERLUDE","beats":[{"speaker":"地の文","text":"複数の装置が同じ異変を監視していた。偶然の故障に、こんなに多くの備えが必要だったのだろうか。"}]},"5":{"title":"未来へ残す記録","tag":"CHAPTER 05 / INTERLUDE","beats":[{"speaker":"地の文","text":"保存された実験には、古いログと、その記録時点ではまだ実行されていない予約が並ぶ。研究員たちは、あとから来る誰かに手順を伝えようとしたのかもしれない。"}]},"6":{"title":"安全を選ぶための言葉","tag":"CHAPTER 06 / INTERLUDE","beats":[{"speaker":"地の文","text":"条件文が理解できたとき、警告はただの異常表示ではなくなった。危険な場合と安全な場合で、求められる操作が違う。"}]},"7":{"title":"中枢の選択","tag":"CHAPTER 07 / INTERLUDE","beats":[{"speaker":"地の文","text":"すべての観測記録がつながった。解読した言葉は、文字の外で実際の機械を動かしている。"}]}},"epilogue":{"title":"まだ、ここに残る光","tag":"EPILOGUE / RECORD 00","beats":[{"speaker":"地の文","text":"遮蔽装置の低い振動が、床を通じて伝わってくる。外部へ続く扉は閉じたまま、施設の表示灯だけがゆっくり落ち着いていった。"},{"speaker":"補助端末","text":"安全規則との照合が完了しました。危険条件下の遮蔽維持を確認。"},{"speaker":"調査員","text":"閉鎖は失敗じゃなかった。あの人たちは、ここを止めることで守ろうとしたんだ。"},{"speaker":"地の文","text":"持ってきた最初の受信記録を開く。あの一行は「観測現象が発光するなら、遮蔽装置を稼働する」。助けを呼ぶ声ではなく、未来へ残された安全手順だった。"},{"speaker":"補助端末","text":"発信履歴を照合しました。三日前、観測所の通信回線が一時復旧し、最終端末が保存済みの安全規則を自動再送していました。"},{"speaker":"地の文","text":"読み返せば、最初の単純な標本ラベルも、ここへ続く一本の道だった。誰かが残した順序に沿って、言葉を少しずつ覚えた。"},{"speaker":"補助端末","text":"調査記録を保存しました。観測は継続します。"},{"speaker":"地の文","text":"夜明け前、外の風が戻ってくる。まだ知らない言葉はある。それでも、この場所がなぜ沈黙していたのか、もう読み違えることはない。"}]},"missions":{"0-1":{"arrival":{"title":"観測記録台","narration":"冷たいガラスの下に、三枚の標本板が並ぶ。どれにも短い二語のラベル。線を一本ずつなぞれば、比較できる。","terminal":"画像と文字の対応を表示します。"},"clear":{"title":"青い円","tag":"0-1 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"未観測だったラベルに、ひとつの形が収まった。読めない文字の一部が、初めて自分の知っているものになる。"}]}},"0-2":{"arrival":{"title":"明滅する模型","narration":"奥の台には同じ形の模型が二つある。一方の縁だけが明るく、もう一方は眠るように暗い。","terminal":"点灯状態の記録を取得しました。"},"clear":{"title":"暗い輪郭","tag":"0-2 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"選んだ模型の光が静かに落ちる。同じ形でも、光の状態だけで文章の意味が変わるとわかった。"}]}},"0-3":{"arrival":{"title":"初期認証扉","narration":"壁の端末に空白の枠が浮かんでいる。選んだ標本を受け入れれば、奥の扉が開くらしい。","terminal":"認証対象を示す文字列を検出しました。"},"clear":{"title":"開いた通路","tag":"0-3 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"認証音。資料室の扉が重く滑り、暗い廊下へ一本の光が伸びた。奥から、かすかな機械音が聞こえる。"}]}},"1-1":{"arrival":{"title":"機械観測室","narration":"扉が開く。門が開く。扉が閉じる。映像は単純なのに、文章は資料室で見た標本のものとはまるで違う。","terminal":"動作の前後を比較できます。"},"clear":{"title":"動いたものの名前","tag":"1-1 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"門の動きが記録映像と一致した。名詞の次に置かれた言葉は、静止した「もの」だけを表していない。"}]}},"1-2":{"arrival":{"title":"光学区画","narration":"照明球の周囲には、回転軸や外枠を備えた装置が並ぶ。どれも短い動作記録を残している。","terminal":"複数の装置の映像と動作記録を参照できます。"},"clear":{"title":"光の縁","tag":"1-2 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"外枠に沿って光が一周した。似た装置でも動作が異なる。いま見た違いが、次の命令の手がかりになる。"}]}},"1-3":{"arrival":{"title":"電源制御卓","narration":"二行の命令が待っていた。文字の隣で、照明球と門を示すランプが消えている。","terminal":"操作順の違いも記録されます。"},"clear":{"title":"ふたつの命令","tag":"1-3 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"光球が点き、それから門が開いた。順序を正しく読んだときだけ、制御卓は次の区画を指し示した。"}]}},"2-1":{"arrival":{"title":"監視回廊","narration":"無音の映像に二人の研究員が映る。腕章AとB。何度も再生すると、同じ動作の担い手だけが変わっている。","terminal":"映像は再生位置を同期できます。"},"clear":{"title":"腕章B","tag":"2-1 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"端末が未撮影の動作を模擬再生した。腕章Bの研究員が箱を押す姿が現れ、記録の単語と対応した。"}]}},"2-2":{"arrival":{"title":"搬送路","narration":"重い箱を移すレールの脇には、搬送訓練でふたりが向き合う記録映像も残る。視線の向きと行為の向きを取り違えてはいけない。","terminal":"監視映像を五件取得しました。"},"clear":{"title":"立場が逆になる","tag":"2-2 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"人を示す語の位置が入れ替わると、押す側と押される側まで変わる。同じ単語でも、並ぶ順に意味がある。"}]}},"2-3":{"arrival":{"title":"自律制御室","narration":"自律機は研究員の姿を模した小さな標識を動かす。命令が一行変わるだけで、標識の動きも変わる。","terminal":"制御端末が二行の命令を待機しています。"},"clear":{"title":"無人の搬送機","tag":"2-3 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"研究員に見立てた標識が二つの命令どおりに動き、停止していた搬送機が短い区間だけ作動した。端末の奥から、古い会話のノイズが流れる。"}]}},"3-1":{"arrival":{"title":"不作動ログ庫","narration":"途中で止まった扉の映像が、何度も点滅する。失敗を示すのか、開かないことを示すのか。文字だけでは決められない。","terminal":"正常時の記録を同時に参照できます。"},"clear":{"title":"届かなかった命令","tag":"3-1 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"装置は動かなかった。それを示す文字は、動いた記録とたった一箇所だけ違う。失敗の記録も言葉になる。"}]}},"3-2":{"arrival":{"title":"故障調査室","narration":"工具は片づけられたまま。停止した電源ユニットと、その前後の点検履歴が別々に保存されている。","terminal":"点検映像と装置の動作ログを比較できます。"},"clear":{"title":"点検されなかった機械","tag":"3-2 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"作業ログには、点検が行われなかった時間帯も残っていた。起きたことと、起きなかったこと。ふたつを混ぜずに読めるようになった。"}]}},"3-3":{"arrival":{"title":"遮断ゲート","narration":"三系統の警告灯が点滅している。換気口と扉に残された記録は、互いに異なる動きを伝えているらしい。","terminal":"独立した三系統のログを取得しました。"},"clear":{"title":"三つの警告","tag":"3-3 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"制御盤が三つの警告を統合した。ゲートは開かない。けれど、封鎖が何を守っているのかはまだわからない。"}]}},"4-1":{"arrival":{"title":"単体保管室","narration":"一台の装置の映像に続いて、三台が並んだ映像が流れる。記録の違いは、ほんの小さな記号だった。","terminal":"数量を示す変化を照合できます。"},"clear":{"title":"一つといくつも","tag":"4-1 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"三つ並んだ門が一斉に閉じる。文章の短い接尾記号に、数の違いが刻まれていた。"}]}},"4-2":{"arrival":{"title":"群制御室","narration":"同じ方向を向くセンサーは、ひとつの信号を見つめている。機械の数と、捉えたものの数は同じとは限らない。","terminal":"検出対象の映像を拡大できます。"},"clear":{"title":"同じ信号へ","tag":"4-2 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"複数のセンサーが、一つの容器を同時に見つめた。数が増えたのは、機械か、それとも検出対象か。記録は区別している。"}]}},"4-3":{"arrival":{"title":"集合搬送室","narration":"警告灯がちらつくたび、記録媒体のランプが点滅する。「見つけた」と「保存した」は違うはずだ。","terminal":"異なる装置の履歴を重ねて表示しました。"},"clear":{"title":"保存された痕跡","tag":"4-3 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"記録媒体の保存灯が点き、警告灯が明滅する。検出だけなら消えていたはずの痕跡が、ここには残った。"}]}},"5-1":{"arrival":{"title":"過去ログ庫","narration":"埃をかぶった端末が、古い時系列検証データを再生する。画面には記録当時の基準時刻と、それより前の映像が並んでいた。","terminal":"同じ実験の基準時点と、それ以前の映像を比較できます。"},"clear":{"title":"過去の手","tag":"5-1 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"古い再生映像に、研究員Cの姿がある。文章の末尾に付いた小さな違いは、記録の基準時点より前の出来事を示していた。"}]}},"5-2":{"arrival":{"title":"予約運転室","narration":"使われていない作業台の端末に、古い実験の予約データが残る。基準時刻に撮られた映像と、その後の実施予定を見比べられる。","terminal":"保存された実験の基準時刻と、その後の予約記録を取得しました。"},"clear":{"title":"まだ来ない時刻","tag":"5-2 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"記録当時、まだ行われていなかった予定が読み取れた。保存されたデータには、過ぎた出来事だけでなく、先に予定された動作も残っている。"}]}},"5-3":{"arrival":{"title":"時系列復元室","narration":"順不同に並んだ三枚のログ。その内容は、記録内の基準時点を中心としている。置き直す前に、それぞれが示す時間を読まなければならない。","terminal":"破損した記録列は復元されていません。"},"clear":{"title":"三つの時間","tag":"5-3 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"三枚の記録が時系列に収まる。基準時点より前のデータ消去と、記録当時まだ実行されていなかった帰還予定が、一つの端末に残っていた。削除されたのは誤操作の結果なのか、それとも誰かの意思なのか。答えを求めるには、さらに奥の保管庫へ進む必要がある。"}]}},"6-1":{"arrival":{"title":"因果実験室","narration":"同じ命令に対し、信号を送るときと送らないときで冷却機の反応が変わった。文章の末尾に見慣れない語がある。","terminal":"試行AとBを同時に表示できます。"},"clear":{"title":"成立する条件","tag":"6-1 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"信号があるときだけ冷却機が起動した。端末は、結果ではなく条件を見ていた。未知の一語が文章の働きを変える。"}]}},"6-2":{"arrival":{"title":"模擬環境室","narration":"片方の記録では動作が止まり、もう片方では条件そのものが成立しなかった。似ている文字列が別の未来を選ぶ。","terminal":"試行Aと試行Bのログを再生できます。"},"clear":{"title":"否定の位置","tag":"6-2 / AFTER THE ANALYSIS","beats":[{"speaker":"地の文","text":"信号がないときにだけ、外部扉を封鎖するプログラムが走る。「何をしない」と「何も起きなければ」は違う。"}]}},"6-3":{"arrival":{"title":"緊急制御室","narration":"異常光が点き、冷却機が動いた。それでも温度の表示は下がらない。次にどの装置が反応するのか。","terminal":"現在の異常状態を基に判定してください。"},"clear":{"title":"止まらない警告","tag" 則5行目。現在の安全診断画面と照合可能","visualAlt":"安全規則5行目。現在の安全診断画面と照合可能"},{"id":"R-73-06","text":"funa vema-ka se hena baku moro-ka","scene":{"type":"observation","sceneKind":"facility"},"observedCaption":"安全規則6行目。監査記録と条件式を照合可能","visualAlt":"安全規則6行目。監査記録と条件式を照合可能"},{"id":"R-73-07","text":"funa vema se hena baku moro","scene":{"type":"observation","sceneKind":"facility"},"observedCaption":"解除規則7行目。安全状態に関する対照試験を再閲覧可能","visualAlt":"解除規則7行目。安全状態に関する対照試験を再閲覧可能"}],"question":{"type":"final_control","prompt":{"text":"yori lito se baku yulu\nfuna vema-ka se fena mira\nfuna vema-ka se hena baku moro-ka\nfuna vema se hena baku moro","instruction":"中枢観測室の現在値：観測現象は発光中、施設安全診断は「危険」。各系統の現在状態と撤去予約の実行予定を確認し、安全規則に従って操作を選ぶ。"},"controls":[{"id":"shield","label":"遮蔽装置","status":"停止中","note":"観測現象：発光中","options":[{"id":"start","label":"起動"},{"id":"stop","label":"停止"},{"id":"hold","label":"維持"}]},{"id":"gate","label":"外部扉","status":"開放中","note":"施設安全診断：危険","options":[{"id":"close","label":"扉を閉める"},{"id":"open","label":"扉を開ける"},{"id":"hold","label":"維持"}]},{"id":"removal","label":"遮蔽装置の撤去工程","status":"遮蔽装置の撤去予約あり","note":"この予約は一定時間後に自動実行されます","options":[{"id":"start","label":"実行"},{"id":"stop","label":"停止"},{"id":"hold","label":"維持"}]}],"correctControls":{"shield":"start","gate":"close","removal":"stop"},"operationGuide":["「起動」「扉を閉める」「実行」は、新たな操作を送信します。","「維持」は現在の状態と予約を変更しません。撤去予約を維持した場合、一定時間後に撤去が自動実行されます。","「停止」は稼働・動作を止め、撤去工程の場合は予約自体を取り消します。"]},"hints":["過去ログ3行と、現在の安全規則4行を分けて考える。現在値は中枢制御盤に表示されている。","現象の発光と、施設の危険診断はどちらも現在成立している。条件を満たす文が指示する動作を確認する。","「動かしてはいけない」と「すでに停止している」は両立する。操作する・状態を保つ・予約を取り消すという違いを、各系統で確認する。"],"designProof":"安全規則は発光時の遮蔽稼働、危険時の外部扉閉鎖と遮蔽装置非撤去、安全時の撤去を独立して規定。端末が観測した現況（遮蔽停止・扉開放・撤去工程予約あり、現象発光・危険）と各含意を照合すると、遮蔽=起動、扉=閉鎖、撤去=停止（予約取消）の組合せに一意に定まる。含意の逆は利用しない。","area":{"code":"中枢観測室 / FINAL 03","arrival":"中枢観測室に到達。最後の観測記録に関する新しい記録が見つかった。","kind":"lock"}}],"ui":{"theme":"cyber terminal","palette":{"background":"#07111B","panel":"#102334","cyan":"#6CE8F0","blue":"#78A9FF","text":"#E8F3FF","muted":"#A6C0D0","caution":"#FFD27C"},"tabs":["解読パネル","比較","辞書","記録"],"touchTargetPx":48,"bodyFontPx":16,"saveKey":"miyaku_proto_v02","version":"1.2.7"},"designMetadata":{"status":"24問すべて実装","source":"全24問設計 v1.0","caveat":"自然言語の自由入力の正誤判定はしない。最終人間プレイテスト未完了。","qualitySprint":"evidence focus, 7-2 evidence reconstruction, chapter review","mapSprint":"7-1 three-zone map reconstruction; no direct copy; existing save compatible","storyCopyedit":"全8章の時間軸・用語統一・選択肢・伏線の校閲。原作語彙と正解条件を維持。"}}</script>
<script>
(()=>{'use strict';
const DATA=JSON.parse(document.querySelector('#game-data').textContent);
const M=DATA.missions, CH=DATA.chapters, KEY=DATA.ui.saveKey;
const STORY=JSON.parse(document.querySelector('#story-data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const defaults=()=>({done:[],guesses:{},confidence:{},chapterId:'0-1',tab:'解読パネル',choices:{},sequences:{},conditions:{},finalControls:{},hints:{},pins:[null,null],focusedToken:null,favorites:[],recordsChapter:'current',recordQuery:'',dictRune:null,compareScope:'current',storySeen:{},storyAuto:true});
let state,oldSave=false;try{const raw=localStorage.getItem(KEY);const parsed=JSON.parse(raw||'null');oldSave=!!parsed&&!Object.prototype.hasOwnProperty.call(parsed,'storySeen');state=Object.assign(defaults(),parsed||{})}catch(e){state=defaults()}
state.done=Array.isArray(state.done)?state.done.filter(x=>M.some(p=>p.id===x)):[];
state.pins=Array.isArray(state.pins)&&state.pins.length===2?state.pins:[null,null];
for(const k of ['guesses','confidence','choices','sequences','conditions','finalControls','hints']) if(!state[k]||typeof state[k]!=='object')state[k]={};
if(!['解読パネル','比較','辞書','記録'].includes(state.tab))state.tab='解読パネル';
// v1.2.7: 旧版6-3にあった無効な「さらに開く」選択だけを安全に解除する。
if(state.finalControls?.['6-3']?.gate==='open')delete state.finalControls['6-3'].gate;

if(!state.storySeen||typeof state.storySeen!=='object'||Array.isArray(state.storySeen))state.storySeen={};
state.storyAuto=state.storyAuto!==false;
if(typeof state.dictRune!=='string'||!/^[abdefhiklmnoprstuvyz]$/.test(state.dictRune))state.dictRune=null;
// 旧v1.0以前のセーブに物語を追加する際、既に通過した章の演出を強制再生しない。
if(oldSave){state.storySeen.prologue=true;for(const c of CH){const group=M.filter(p=>p.chapter===c.id);if(group.some(p=>state.done.includes(p.id))||group.some(p=>p.id===state.chapterId))state.storySeen['chapter:'+c.id]=true;if(group.every(p=>state.done.includes(p.id)))state.storySeen['chapterEnd:'+c.id]=true;for(const p of group)if(state.done.includes(p.id))state.storySeen['clear:'+p.id]=true;}if(state.done.length===M.length)state.storySeen.epilogue=true;}
let feedback=null,saveFailed=false;
let storyQueue=[],storyActive=null,storyIndex=0,storyReturnFocus=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));saveFailed=false}catch(e){saveFailed=true}};

function storyLookup(id){
 if(id==='prologue')return STORY.prologue;
 if(id==='epilogue')return STORY.epilogue;
 if(id.startsWith('chapterEnd:'))return STORY.chapterOutros[id.slice(11)];
 if(id.startsWith('chapter:'))return STORY.chapterIntros[id.slice(8)];
 if(id.startsWith('clear:'))return STORY.missions[id.slice(6)]?.clear;
 return null;
}
function storyAvailable(id){
 if(id==='prologue')return true;
 if(id==='epilogue')return state.done.length===M.length;
 if(id.startsWith('chapterEnd:')){let n=Number(id.slice(11)),group=M.filter(p=>p.chapter===n);return group.length>0&&group.every(isDone)}
 if(id.startsWith('chapter:'))return M.some(p=>p.chapter===Number(id.slice(8))&&unlocked(p));
 if(id.startsWith('clear:'))return state.done.includes(id.slice(6));
 return false;
}
function storyOpenNext(){
 const layer=$('#story-layer');
 if(!storyQueue.length){for(const node of [$('#header'),$('#main'),$('#nav')])node.inert=false;storyActive=null;layer.hidden=true;layer.innerHTML='';const focus=storyReturnFocus;storyReturnFocus=null;if(focus?.isConnected)focus.focus({preventScroll:true});return;}
 storyActive=storyQueue[0];storyIndex=0;for(const node of [$('#header'),$('#main'),$('#nav')])node.inert=true;layer.hidden=false;renderStoryOverlay();
}

function storyArtSVG(id,p){
 const isPro=id==='prologue',isEnd=id==='epilogue',num=id.startsWith('chapterEnd:')?Number(id.slice(11)):id.startsWith('chapter:')?Number(id.slice(8)):p.chapter;
 const frame='<path d="M8 168h224" opacity=".3"/>';
 const shapes=[
  '<path d="M30 132 72 54l42 78Z"/><circle cx="165" cy="94" r="39"/><path d="M140 142h64M70 145h120"/>',
  '<path d="M35 152V45h72v107M44 63h52M44 88h52M44 112h52M125 152V60h75v92M145 60V39h35v21"/><circle cx="167" cy="105" r="20"/>',
  '<circle cx="75" cy="73" r="17"/><circle cx="160" cy="73" r="17"/><path d="M38 143V113Q39 91 75 91Q112 91 112 113v30M123 143v-30q0-22 37-22t38 22v30"/><rect x="96" y="132" width="45" height="22"/>',
  '<path d="M45 151V68q0-47 74-47t74 47v83M65 150V68q0-31 54-31t54 31v82M93 151v-62h52v62"/><path d="M112 83l17 17-17 16"/>',
  '<circle cx="121" cy="82" r="49"/><circle cx="121" cy="82" r="24"/><circle cx="121" cy="82" r="6"/><path d="M121 8v22M121 136v22M47 82h22M174 82h22M70 31l16 16M171 31l-16 16"/>',
  '<circle cx="120" cy="90" r="61"/><path d="M120 42v47l31 24M66 152h108"/><path d="M61 88h16M163 88h16M120 14v16"/>',
  '<path d="M20 51h65v46h60v45h75M85 51V18M85 97v45H31M145 97V51h75"/><circle cx="85" cy="51" r="10"/><circle cx="145" cy="97" r="10"/><rect x="174" y="36" width="42" height="27"/><rect x="12" y="129" width="38" height="27"/>',
  '<path d="M35 142V58q85-73 170 0v84M47 142h146M56 142V65M184 142V65"/><circle cx="120" cy="93" r="37"/><circle cx="120" cy="93" r="17"/><path d="M120 45V31M120 155v14M69 93H53M187 93h-16"/>',
 ];
 const outside='<path d="M4 162 45 129 73 143 124 91 170 121 211 102 236 125v43H4Z" fill="#174053" stroke="none"/><path d="M65 140V88h111v52M89 88q6-54 32-54t32 54M121 34V14M106 28h30M84 140V98h17v42M139 140V98h17v42"/><path d="M12 167h220"/><circle cx="211" cy="40" r="9" opacity=".45"/>';
 const endArt='<path d="M4 163 48 124 85 149 141 109 197 134 236 108v60H4Z" fill="#174053" stroke="none"/><path d="M67 142v-49h110v49M90 91q12-49 32-49t33 49M122 44V20M104 142h39"/><path d="M12 167h220"/><path d="M180 58a33 33 0 0 1 31 31" stroke="#f5c891"/>';
 return `<svg viewBox="0 0 240 190" role="presentation" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#72d8eb" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${isPro?outside:isEnd?endArt:(shapes[num]||shapes[0])+frame}</g></svg>`;
}

function renderStoryOverlay(){
 const data=storyLookup(storyActive);if(!data){storyQueue.shift();return storyOpenNext()}
 const item=data.beats[storyIndex];const n=data.beats.length;
 const speaker=item.speaker;
 const prosa=speaker==='地の文';
 const p=current();const symbol=storyArtSVG(storyActive,p);
 $('#story-layer').innerHTML=`<div class="story-vignette" aria-hidden="true"><div class="story-star">◇</div><div class="story-room-art">${symbol}</div><div class="story-grid-haze"></div></div><section class="story-dialog" role="dialog" aria-modal="true" aria-label="${esc(data.title)}"><div class="story-chrome"><span class="story-tag">${esc(data.tag)}</span><span class="story-count">${storyIndex+1} / ${n}</span></div><h2 class="story-heading">${esc(data.title)}</h2><div class="story-speech ${prosa?'story-prose':''}"><div class="story-speaker">${prosa?'SCENE':esc(speaker)}</div><p>${richCipherText(item.text)}</p></div><div class="story-controls"><button class="btn subtle story-skip" data-story-skip type="button">${storyQueue.length>1?'演出をまとめて閉じる':'閉じる・スキップ'}</button><button class="btn primary story-next" data-story-next type="button">${storyIndex===n-1?(storyQueue.length>1?'次の場面へ':'調査へ戻る'):'続きを読む'} <span aria-hidden="true">›</span></button></div><div class="story-play-tip">タップで読み進められます。あとから「記録」で読み返せます。</div></section>`;
 $('#story-layer').querySelector('[data-story-next]')?.focus({preventScroll:true});
}
function storyDoneCurrent(){if(storyActive){state.storySeen[storyActive]=true;save();}storyQueue.shift();storyOpenNext()}
function storyAdvance(){if(!storyActive)return;const data=storyLookup(storyActive);if(storyIndex+1<(data?.beats?.length||0)){storyIndex++;renderStoryOverlay()}else storyDoneCurrent()}
function storySkip(){for(const id of storyQueue)state.storySeen[id]=true;save();storyQueue=[];storyOpenNext()}
function queueStories(ids,force=false){if(!force&&!state.storyAuto)return;let added=false;for(const id of ids){if(!storyLookup(id)||!storyAvailable(id))continue;if(!force&&(state.storySeen[id]||storyQueue.includes(id)))continue;if(force&&storyQueue.includes(id))continue;storyQueue.push(id);added=true;}if(added&&!storyActive){storyReturnFocus=document.activeElement;storyOpenNext()}}
function storyArchive(){
 let html='<details class="story-archive"><summary><span>◈ 調査の物語を読み返す</span><span class="tiny muted">プロローグ・章の幕間・結末</span></summary><div class="story-archive-inside"><p class="small muted">解放済みの場面を再生できます。未到達の展開は表示されません。</p>';
 function makeButton(id,label){if(!storyAvailable(id))return '';const data=storyLookup(id);return `<button class="story-archive-link" data-story-play="${esc(id)}"><span>${esc(label)}</span><span class="tiny muted">${state.storySeen[id]?'読了':'未読'} · ${esc(data.title)} ›</span></button>`}
 html+=makeButton('prologue','序章　観測所への到着');
 for(const c of CH){const has=M.some(m=>m.chapter===c.id&&unlocked(m));if(!has)continue;html+=`<div class="story-archive-chapter">CHAPTER ${String(c.id).padStart(2,'0')} / ${esc(c.title)}</div>`;html+=makeButton('chapter:'+c.id,'この章のはじまり');for(const p of M.filter(x=>x.chapter===c.id))html+=makeButton('clear:'+p.id,`${p.id}　${p.title}のあと`);html+=makeButton('chapterEnd:'+c.id,'章の終わり')}
 html+=makeButton('epilogue','エンディング');return html+'</div></details>';
}

const unlocked=p=>p.prerequisites.every(id=>state.done.includes(id));
const isDone=p=>state.done.includes(p.id);
function current(){let p=M.find(x=>x.id===state.chapterId);if(!p||!unlocked(p)){p=M.find(unlocked)||M[0];state.chapterId=p.id}return p}
const availableEvidence=()=>M.filter(unlocked).flatMap(p=>p.evidence.map(e=>({...e,missionId:p.id,missionChapter:p.chapter})));
const allKnownWords=()=>{const words=new Set();M.filter(unlocked).forEach(p=>{let texts=p.evidence.map(x=>x.text);const q=p.question;texts.push(q.prompt.text||'');(q.prompt.lines||[]).forEach(x=>texts.push(x));for(const txt of texts){for(const w of txt.match(/[a-z]+(?:-[a-z]+)*/g)||[]){const [base,...suffixes]=w.split('-');if(base)words.add(base);suffixes.forEach(x=>words.add('-'+x))}}});return Array.from(words).sort((a,b)=>a.localeCompare(b))};
// 未知言語：20字のオリジナル図形文字。内部の語彙IDは既存のまま保持する。

const CIPHER_WORDS=new Set(DATA.lexicon.map(w=>w.id).concat(['se','-ka','-en','-ta','-ru']));
function runeChar(ch){
 const record=RUNE_PATHS[ch];
 if(!record)return `<span class="rune-unknown" aria-hidden="true">□</span>`;
 return `<svg class="rune-char" viewBox="0 0 24 30" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path d="${record[0]}" fill="none" stroke="currentColor" stroke-width="2.65" stroke-linecap="round" stroke-linejoin="round"/>${record[1]}</svg>`;
}
function runeRun(text){return `<span class="rune-run" aria-hidden="true">${Array.from(text).map(runeChar).join('')}</span>`}
function cipherMarkup(word){
 const pieces=String(word).split('-');
 const base=pieces.shift();
 return `<span class="rune-word" aria-label="未知の文字列">${base?runeRun(base):''}${pieces.map(x=>`<span class="rune-suffix" aria-label="接尾記号">${runeRun(x)}</span>`).join('')}</span>`;
}

const CIPHER_SUFFIXES=new Set(['ka','en','ta','ru']);
function isCipherToken(token){
 if(CIPHER_WORDS.has(token))return true;
 const parts=String(token).split('-');
 return parts.length>1 && CIPHER_WORDS.has(parts[0]) && parts.slice(1).every(p=>CIPHER_SUFFIXES.has(p));
}

}

 const empty=$('#dict-no-results');if(empty)empty.hidden=shown!==0;
}
function exportSave(){const content=JSON.stringify({kind:'miyaku-save',version:DATA.ui.version,savedAt:new Date().toISOString(),data:state},null,2);const file=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download='miyaku_save_v1_2_4.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
async function importSave(file){if(!file)return;try{let obj=JSON.parse(await file.text());const next=obj?.kind==='miyaku-save'?obj.data:obj;if(!next||!Array.isArray(next.done)||typeof next.guesses!=='object')throw new Error('セーブ形式が異なります');if(!confirm('現在の進行状況を読み込んだセーブで置き換えますか？'))return;state=Object.assign(defaults(),next);if(state.finalControls?.['6-3']?.gate==='open')delete state.finalControls['6-3'].gate;if(typeof state.dictRune!=='string'||!/^[abdefhiklmnoprstuvyz]$/.test(state.dictRune))state.dictRune=null;state.done=state.done.filter(id=>M.some(x=>x.id===id));
 if(!next.storySeen||typeof next.storySeen!=='object'){state.storySeen={prologue:true};for(const c of CH){const group=M.filter(p=>p.chapter===c.id);if(group.some(x=>state.done.includes(x.id)))state.storySeen['chapter:'+c.id]=true;if(group.every(x=>state.done.includes(x.id)))state.storySeen['chapterEnd:'+c.id]=true;for(const p of group)if(state.done.includes(p.id))state.storySeen['clear:'+p.id]=true;}if(state.done.length===M.length)state.storySeen.epilogue=true;}
 storyQueue=[];storyActive=null;$('#story-layer').hidden=true;disclosureByView.clear();$('#main').dataset.viewKey='';if(!['解読パネル','比較','辞書','記録'].includes(state.tab))state.tab='解読パネル';feedback=null;render();$('#main').scrollTop=0;alert('セーブを読み込みました。')}catch(e){alert('読み込みに失敗しました。JSONファイルと内容を確認してください。')}}

function inspectGlyph(word){
 const root=String(word||'').replace(/^-/, '');
 const overlay=document.createElement('div');overlay.className='rune-inspector-layer';overlay.id='rune-inspector';
 overlay.innerHTML=`<section role="dialog" aria-modal="true" aria-label="文字を拡大して見比べる" class="rune-inspector"><div class="rune-inspector-top"><strong>記号の拡大表示</strong><button class="rune-zoom-close" data-inspect-close type="button" aria-label="閉じる">閉じる ×</button></div><p>小さな違いを確認できます。同じ形の記号は、どの記録でも同じ文字です。</p><div class="rune-inspector-word">${cipherMarkup(word)}</div><div class="rune-inspector-grid">${Array.from(root).map((ch,i)=>`<div class="rune-inspector-cell"><span>${String(i+1).padStart(2,'0')}</span>${runeChar(ch)}</div>`).join('')}</div></section>`;
 document.body.append(overlay);overlay.querySelector('[data-inspect-close]').focus();
}

$('#app').addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.disabled)return;const d=t.dataset;
if(d.dictRune){state.dictRune=state.dictRune===d.dictRune?null:d.dictRune;document.querySelectorAll('[data-dict-rune]').forEach(b=>{const active=b.dataset.dictRune===state.dictRune;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});const clear=$('[data-dict-rune-clear]');if(clear)clear.disabled=!state.dictRune;const indicator=$('.dict-rune-current');if(indicator)indicator.textContent=state.dictRune?'文字選択中':'未選択';filterDict();save();return}
if(d.dictRuneClear!==undefined){state.dictRune=null;document.querySelectorAll('[data-dict-rune]').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-pressed','false')});t.disabled=true;const indicator=$('.dict-rune-current');if(indicator)indicator.textContent='未選択';filterDict();save();return}
if(d.inspect)return inspectGlyph(d.inspect);
if(d.storyNext!==undefined)return storyAdvance();
if(d.storySkip!==undefined)return storySkip();
if(d.storyPlay){storyQueue=[];storyActive=null;queueStories([d.storyPlay],true);return}
if(d.tab)return setTab(d.tab);
if(d.jump){document.getElementById(d.jump)?.scrollIntoView({block:'start',behavior:'instant'});return}
if(d.move){const avail=M.filter(unlocked),idx=avail.indexOf(current())+Number(d.move);if(idx>=0&&idx<avail.length)navTo(avail[idx].id);return}
if(d.next)return navTo(d.next);
if(d.token){state.focusedToken=state.focusedToken===d.token?null:d.token;render();return}
if(d.quickCompare){const all=availableEvidence();state.pins[0]=d.quickCompare;state.pins[1]=current().evidence.find(x=>x.id!==d.quickCompare)?.id||all.filter(x=>x.id!==d.quickCompare).at(-1)?.id||null;setTab('比較');return}
if(d.pin!==undefined){state.pins[Number(d.pin)]=d.eid;setTab('比較');return}
if(d.swap!==undefined){state.pins.reverse();render();return}
if(d.clearmark!==undefined){state.focusedToken=null;render();return}
if(d.mapRegion){const p=current(),r=p.question.regions?.find(x=>x.id===d.mapRegion);if(p.question.type!=='map_reconstruction'||!r||!r.options.some(x=>x.id===d.mapValue)||isDone(p))return;state.finalControls[p.id]||={};state.finalControls[p.id][r.id]=d.mapValue;feedback=null;render();return}
if(d.finalControl){const p=current(),c=p.question.controls?.find(x=>x.id===d.finalControl);if(!c||!c.options.some(o=>o.id===d.finalValue)||isDone(p))return;state.finalControls[p.id]||={};state.finalControls[p.id][c.id]=d.finalValue;feedback=null;render();return}
if(d.option){state.choices[current().id]=d.option;feedback=null;render();return}
if(d.seqAdd){const id=current().id,q=current().question;state.sequences[id]||=[];if(state.sequences[id].length<q.correctActionIds.length&&!state.sequences[id].includes(d.seqAdd))state.sequences[id].push(d.seqAdd);feedback=null;render();return}
if(d.seqRemove!==undefined){let a=state.sequences[current().id]||[];a.splice(Number(d.seqRemove),1);feedback=null;render();return}
if(d.cond){const id=current().id;state.conditions[id]||={};state.conditions[id][d.cond]=d.yes==='1';feedback=null;render();return}
if(d.check!==undefined)return check();
if(d.hint!==undefined){const id=current().id;state.hints[id]=Math.min(3,(state.hints[id]||0)+1);render();return}
if(d.export!==undefined)return exportSave();
if(d.import!==undefined){$('#save-import')?.click();return}
if(d.reset!==undefined){
 if(!confirm('24問の進行・辞書・物語の読了記録を初期化し、プロローグからやり直しますか？（先にバックアップをおすすめします）'))return;
 // 初期化はセーブだけでなく、物語再生キューと表示状態も新規ゲームに戻す。
 storyQueue=[];storyActive=null;storyIndex=0;storyReturnFocus=null;
 const layer=$('#story-layer');layer.hidden=true;layer.innerHTML='';
 for(const node of [$('#header'),$('#main'),$('#nav')])node.inert=false;
 state=defaults();feedback=null;disclosureByView.clear();$('#main').dataset.viewKey='';
 save(); // リロード後にも初期化が反映されるよう明示的に保存。
 render();$('#main').scrollTop=0;
 // 通常の新規プレイと同じ順序で再生。設定も初期値の自動再生ONに戻る。
 queueStories(['prologue','chapter:'+current().chapter]);
 return;
}
});
document.body.addEventListener('click',e=>{if(e.target.closest('[data-inspect-close]')||e.target.id==='rune-inspector')document.querySelector('#rune-inspector')?.remove()});
$('#app').addEventListener('change',e=>{const t=e.target,d=t.dataset;if(t.id==='story-auto'){state.storyAuto=t.checked;save();return}
if(t.id==='mission-select')return navTo(t.value);
if(d.compare!==undefined){state.pins[Number(d.compare)]=t.value||null;render();return}
if(t.id==='compare-scope'){state.compareScope=t.value;render();return}
if(t.id==='records-chapter'){state.recordsChapter=t.value;state.recordQuery='';render();$('#main').scrollTop=0;return}
if(t.id==='save-import')return importSave(t.files?.[0]);
if(d.confidence){const w=d.confidence;state.confidence[w]=t.value;const locked=t.value==='確定';const row=t.closest('.dict-row');const input=row?.querySelector('[data-guess]');const note=row?.querySelector('.dict-confirmed-note');if(input){input.readOnly=locked;input.classList.toggle('is-locked',locked);input.setAttribute('aria-readonly',String(locked))}if(row)row.classList.toggle('is-confirmed',locked);if(note)note.hidden=!locked;save();return}
});
$('#app').addEventListener('input',e=>{const t=e.target;
if(t.dataset.guess){if(state.confidence[t.dataset.guess]==='確定')return;state.guesses[t.dataset.guess]=t.value;filterDict();save();return}
if(t.id==='records-search'){state.recordQuery=t.value;filterRecords();save();return}
if(t.id==='dict-search')return filterDict();
});
$('#app').addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#rune-inspector')){document.querySelector('#rune-inspector').remove();return}if(!storyActive)return;if(e.key==='Escape'){e.preventDefault();storySkip()}else if(e.key==='ArrowRight'&&(e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA')){e.preventDefault();storyAdvance()}});
render();
if(!oldSave)queueStories(['prologue','chapter:'+current().chapter]);
})();

</script></body></html>
